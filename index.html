<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap The Color</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    let W = 0, H = 0;

    const BASE_HALF = 22;  // starting half-size → 44 px diameter
    const MIN_HALF  = 10;  // minimum half-size → 20 px diameter
    const HIT_PAD   = 10;  // extra tap tolerance beyond visual edge

    const SHAPES = ['circle', 'square', 'triangle'];

    let phase     = 'intro'; // 'intro' | 'waiting' | 'active' | 'result'
    let bgColor   = '';
    let bgHue     = 0;
    let shape     = null;
    let shapeHalf = BASE_HALF;
    let startTime = 0;
    let lastTime  = null;
    let streak    = 0;
    let waitTimer = null;

    let bestTime = localStorage.getItem('ttc_best') !== null
                   ? parseInt(localStorage.getItem('ttc_best'), 10)
                   : null;

    // ── Colours ───────────────────────────────────────────────────────────────

    function randBg() {
      bgHue    = Math.random() * 360;
      const s  = 55 + Math.random() * 25;
      const l  = 38 + Math.random() * 20;
      bgColor  = `hsl(${bgHue},${s}%,${l}%)`;
    }

    function randShapeColor() {
      const h = (bgHue + 150 + Math.random() * 60) % 360;
      const s = 70 + Math.random() * 20;
      const l = 48 + Math.random() * 18;
      return `hsl(${h},${s}%,${l}%)`;
    }

    // ── Drawing ───────────────────────────────────────────────────────────────

    function tracePath(x, y, half) {
      ctx.beginPath();
      switch (shape.type) {
        case 'circle':
          ctx.arc(x, y, half, 0, Math.PI * 2);
          break;
        case 'square':
          ctx.rect(x - half, y - half, half * 2, half * 2);
          break;
        case 'triangle':
          ctx.moveTo(x,        y - half);
          ctx.lineTo(x + half, y + half);
          ctx.lineTo(x - half, y + half);
          ctx.closePath();
          break;
      }
    }

    function drawGame() {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = shape.color;
      tracePath(shape.x, shape.y, shapeHalf);
      ctx.fill();
    }

    function drawWaiting() {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';
      ctx.font         = '20px system-ui,sans-serif';
      ctx.fillStyle    = 'rgba(255,255,255,0.2)';
      ctx.fillText('• • •', W / 2, H * 0.92);
    }

    function drawResult() {
      drawGame();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      const fs1 = Math.max(40, Math.min(80, W * 0.15));
      ctx.font      = `bold ${fs1}px system-ui,sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.fillText(`${lastTime} ms`, cx, cy - H * 0.07);

      const fs2 = Math.max(18, Math.min(28, W * 0.055));
      ctx.font      = `${fs2}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      const bestLabel = bestTime !== null ? `${bestTime} ms` : '—';
      ctx.fillText(`Best: ${bestLabel}`, cx, cy + H * 0.035);

      const fs3 = Math.max(13, Math.min(17, W * 0.036));
      ctx.font      = `${fs3}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      const nextHalf = Math.max(MIN_HALF, BASE_HALF - streak);
      ctx.fillText(`Round ${streak}  ·  next shape ${nextHalf * 2} px`, cx, cy + H * 0.085);

      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillText('Tap anywhere to continue', cx, cy + H * 0.13);
    }

    function drawIntro() {
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      const fs1 = Math.max(32, Math.min(56, W * 0.12));
      ctx.font      = `bold ${fs1}px system-ui,sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.fillText('Tap The Color', cx, cy - H * 0.1);

      const fs2 = Math.max(16, Math.min(22, W * 0.048));
      ctx.font      = `${fs2}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillText('Tap the shape — as fast as you can!', cx, cy + H * 0.02);

      const fs3 = Math.max(13, Math.min(17, W * 0.036));
      ctx.font      = `${fs3}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.35)';
      ctx.fillText('Shape shrinks each round — keep going!', cx, cy + H * 0.07);

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('Tap anywhere to start', cx, cy + H * 0.13);
    }

    function redraw() {
      switch (phase) {
        case 'intro':   drawIntro();   break;
        case 'waiting': drawWaiting(); break;
        case 'active':  drawGame();    break;
        case 'result':  drawResult();  break;
      }
    }

    // ── Hit detection ─────────────────────────────────────────────────────────

    function hitShape(tx, ty) {
      const dx  = tx - shape.x;
      const dy  = ty - shape.y;
      const hit = shapeHalf + HIT_PAD;
      switch (shape.type) {
        case 'circle':
          return dx * dx + dy * dy <= hit * hit;
        case 'square':
          return Math.abs(dx) <= hit && Math.abs(dy) <= hit;
        case 'triangle':
          return Math.abs(dx) <= hit && dy >= -hit && dy <= hit;
      }
      return false;
    }

    // ── Game flow ─────────────────────────────────────────────────────────────

    function showShape() {
      phase = 'active';
      redraw();
      startTime = performance.now();
    }

    function beginWait(fromIntro) {
      clearTimeout(waitTimer);
      if (fromIntro) streak = 0;
      shapeHalf = Math.max(MIN_HALF, BASE_HALF - streak);

      randBg();
      const margin = BASE_HALF + 24;
      shape = {
        type:  SHAPES[Math.floor(Math.random() * SHAPES.length)],
        x:     margin + Math.random() * (W - margin * 2),
        y:     margin + Math.random() * (H - margin * 2),
        color: randShapeColor()
      };
      phase = 'waiting';
      redraw();
      waitTimer = setTimeout(showShape, 1000 + Math.random() * 2000);
    }

    function onTap(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (W / rect.width);
      const y = (clientY - rect.top)  * (H / rect.height);

      if (phase === 'intro')  { beginWait(true);  return; }
      if (phase === 'result') { beginWait(false); return; }

      if (phase === 'active' && hitShape(x, y)) {
        lastTime = Math.round(performance.now() - startTime);
        if (bestTime === null || lastTime < bestTime) {
          bestTime = lastTime;
          localStorage.setItem('ttc_best', lastTime);
        }
        streak++;
        phase = 'result';
        redraw();
      }
    }

    // ── Events ────────────────────────────────────────────────────────────────

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      onTap(e.clientX, e.clientY);
    });

    // ── Resize ────────────────────────────────────────────────────────────────

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width        = Math.round(W * dpr);
      canvas.height       = Math.round(H * dpr);
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.scale(dpr, dpr);
      redraw();
    }

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
