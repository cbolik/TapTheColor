<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Tap The Color</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    canvas { display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <script>
    'use strict';

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');

    let W = 0, H = 0;
    const HALF = 22;   // half of 44 px visual size
    const HIT  = 32;   // half of hit area (with tap tolerance)

    const SHAPES = ['circle', 'square', 'triangle'];

    let phase     = 'intro'; // 'intro' | 'active' | 'result'
    let bgColor   = '';
    let bgHue     = 0;
    let shape     = null;
    let startTime = 0;
    let lastTime  = null;
    let bestTime  = localStorage.getItem('ttc_best') !== null
                    ? parseInt(localStorage.getItem('ttc_best'), 10)
                    : null;

    // ── Colours ───────────────────────────────────────────────────────────────

    function randBg() {
      bgHue    = Math.random() * 360;
      const s  = 55 + Math.random() * 25;  // 55–80 %
      const l  = 38 + Math.random() * 20;  // 38–58 %
      bgColor  = `hsl(${bgHue},${s}%,${l}%)`;
    }

    function randShapeColor() {
      const h = (bgHue + 150 + Math.random() * 60) % 360; // 150–210 ° offset
      const s = 70 + Math.random() * 20;
      const l = 48 + Math.random() * 18;
      return `hsl(${h},${s}%,${l}%)`;
    }

    // ── Shape drawing ─────────────────────────────────────────────────────────

    function shapePath(x, y) {
      ctx.beginPath();
      switch (shape.type) {
        case 'circle':
          ctx.arc(x, y, HALF, 0, Math.PI * 2);
          break;
        case 'square':
          ctx.rect(x - HALF, y - HALF, HALF * 2, HALF * 2);
          break;
        case 'triangle':
          ctx.moveTo(x,        y - HALF);
          ctx.lineTo(x + HALF, y + HALF);
          ctx.lineTo(x - HALF, y + HALF);
          ctx.closePath();
          break;
      }
    }

    function drawGame() {
      ctx.fillStyle = bgColor;
      ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = shape.color;
      shapePath(shape.x, shape.y);
      ctx.fill();
    }

    function drawResult() {
      drawGame();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      const fs1 = Math.max(40, Math.min(80, W * 0.15));
      ctx.font      = `bold ${fs1}px system-ui,sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.fillText(`${lastTime} ms`, cx, cy - H * 0.07);

      const fs2 = Math.max(18, Math.min(28, W * 0.055));
      ctx.font      = `${fs2}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.75)';
      const bestLabel = bestTime !== null ? `${bestTime} ms` : '—';
      ctx.fillText(`Best: ${bestLabel}`, cx, cy + H * 0.04);

      const fs3 = Math.max(14, Math.min(18, W * 0.038));
      ctx.font      = `${fs3}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.fillText('Tap anywhere to play again', cx, cy + H * 0.11);
    }

    function drawIntro() {
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      ctx.textAlign    = 'center';
      ctx.textBaseline = 'middle';

      const fs1 = Math.max(32, Math.min(56, W * 0.12));
      ctx.font      = `bold ${fs1}px system-ui,sans-serif`;
      ctx.fillStyle = '#fff';
      ctx.fillText('Tap The Color', cx, cy - H * 0.1);

      const fs2 = Math.max(16, Math.min(22, W * 0.048));
      ctx.font      = `${fs2}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillText('Tap the shape — as fast as you can!', cx, cy + H * 0.02);

      const fs3 = Math.max(14, Math.min(18, W * 0.038));
      ctx.font      = `${fs3}px system-ui,sans-serif`;
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.fillText('Tap anywhere to start', cx, cy + H * 0.1);
    }

    function redraw() {
      if (phase === 'intro')  { drawIntro();  return; }
      if (phase === 'active') { drawGame();   return; }
      if (phase === 'result') { drawResult(); return; }
    }

    // ── Hit detection ─────────────────────────────────────────────────────────

    function hitShape(tx, ty) {
      const dx = tx - shape.x;
      const dy = ty - shape.y;
      switch (shape.type) {
        case 'circle':
          return dx * dx + dy * dy <= HIT * HIT;
        case 'square':
          return Math.abs(dx) <= HIT && Math.abs(dy) <= HIT;
        case 'triangle':
          // Expanded bounding-box approximation
          return Math.abs(dx) <= HIT && dy >= -(HALF + 10) && dy <= HALF + 10;
      }
      return false;
    }

    // ── Game flow ─────────────────────────────────────────────────────────────

    function startRound() {
      randBg();
      const margin = HALF + 24;
      shape = {
        type:  SHAPES[Math.floor(Math.random() * SHAPES.length)],
        x:     margin + Math.random() * (W - margin * 2),
        y:     margin + Math.random() * (H - margin * 2),
        color: randShapeColor()
      };
      phase = 'active';
      redraw();
      startTime = performance.now();
    }

    function onTap(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = (clientX - rect.left) * (W / rect.width);
      const y = (clientY - rect.top)  * (H / rect.height);

      if (phase === 'intro' || phase === 'result') {
        startRound();
        return;
      }

      if (phase === 'active' && hitShape(x, y)) {
        lastTime = Math.round(performance.now() - startTime);
        if (bestTime === null || lastTime < bestTime) {
          bestTime = lastTime;
          localStorage.setItem('ttc_best', lastTime);
        }
        phase = 'result';
        redraw();
      }
    }

    // ── Events ────────────────────────────────────────────────────────────────

    canvas.addEventListener('pointerdown', e => {
      e.preventDefault();
      onTap(e.clientX, e.clientY);
    });

    // ── Resize ────────────────────────────────────────────────────────────────

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width         = Math.round(W * dpr);
      canvas.height        = Math.round(H * dpr);
      canvas.style.width   = W + 'px';
      canvas.style.height  = H + 'px';
      ctx.scale(dpr, dpr);
      redraw();
    }

    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
